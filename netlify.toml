[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

[[redirects]]
  from = "/api/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "/api/cloudinary-delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "/api/staff-admin"
  to = "/.netlify/functions/staff-admin"
  status = 200

[[redirects]]
  from = "/api/shop-logo"
  to = "/.netlify/functions/shop-logo"
  status = 200

[[redirects]]
  from = "/api/backup-admin"
  to = "/.netlify/functions/backup-admin"
  status = 200

[[redirects]]
  from = "/api/telegram-admin"
  to = "/.netlify/functions/telegram-admin"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/api/system-health"
  to = "/.netlify/functions/system-health"
  status = 200

[[redirects]]
  from = "/api/customer-campaigns"
  to = "/.netlify/functions/customer-campaign-admin"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
