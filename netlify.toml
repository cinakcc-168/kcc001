[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."telegram-notifications"]
  schedule = "*/15 * * * *"

[functions."customer-campaign-dispatch"]
  schedule = "*/15 * * * *"

[functions."system-health"]
  schedule = "0 */6 * * *"

[functions."demand-forecast-schedule"]
  schedule = "0 * * * *"

[functions."integration-webhook-dispatch"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/integration-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/integration-admin"
  to = "/.netlify/functions/integration-admin"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
