[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

[[redirects]]
  from = "/api/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "/api/cloudinary-delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
